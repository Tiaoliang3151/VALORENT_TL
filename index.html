  <!-- Diagnostic overlay: captures console errors, unhandled rejections and shows key globals -->
  <script>
  (function(){
    function createPanel(){
      if(document.getElementById('diag-panel')) return;
      var panel = document.createElement('pre');
      panel.id='diag-panel';
      panel.style.cssText = 'position:fixed;left:10px;bottom:10px;right:10px;max-height:40vh;overflow:auto;z-index:2147483647;background:rgba(17,17,17,0.95);color:#fff;padding:10px;border:2px solid #ff4655;font-size:12px;font-family:monospace;display:none;white-space:pre-wrap;';
      document.body.appendChild(panel);
    }
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded',createPanel);
    } else createPanel();
    function show(msg){
      try{
        var p = document.getElementById('diag-panel');
        if(!p){ createPanel(); p = document.getElementById('diag-panel'); }
        p.style.display='block';
        var time = new Date().toLocaleTimeString();
        p.textContent = time + ' - ' + msg + '\n\n' + p.textContent;
      }catch(e){ console.error('diag show error', e); }
    }
    window.addEventListener('error', function(e){
      var m = e && (e.message || e.error && e.error.message) || String(e);
      var src = (e && (e.filename || (e.error && e.error.fileName))) || '';
      var loc = (e && (e.lineno || '')) + ':' + (e && (e.colno || ''));
      show('ERROR: ' + m + ' at ' + src + ':' + loc);
      console.error(e.error || e.message || e);
    });
    window.addEventListener('unhandledrejection', function(e){
      try{
        var reason = e && e.reason;
        var text = reason && (reason.stack || reason.message) || String(reason);
        show('UNHANDLED REJECTION: ' + text);
        console.error('unhandledrejection', reason);
      }catch(err){ console.error(err); }
    });
    window.addEventListener('load', function(){
      setTimeout(function(){
        try{
          var val = window.__VAL_DATA__ ? Object.keys(window.__VAL_DATA__).join(',') : String(window.__VAL_DATA__);
          show('window.__VAL_DATA__ keys: ' + val);
          if(window.APP_DATA){
            var maps = (window.APP_DATA.MAPS && window.APP_DATA.MAPS.length) || 0;
            var agents = (window.APP_DATA.AGENTS && window.APP_DATA.AGENTS.length) || 0;
            show('window.APP_DATA present - MAPS:' + maps + ' AGENTS:' + agents);
          } else {
            show('window.APP_DATA is ' + String(window.APP_DATA));
          }
        }catch(err){ show('DIAG SERIALIZE ERROR: ' + (err && err.message)); }
      }, 100);
    });
  })();
  </script>
